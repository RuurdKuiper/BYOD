[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "byod-diffusion"
version = "0.1.0"
description = "Build Your Own DLM: single-GPU conversion of instruction LMs into masked diffusion models"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Ruurd J. A. Kuiper", email = "r.j.a.kuiper@umcutrecht.nl"},
  {name = "Robert A. Bagheri"},
]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5",
  "transformers>=4.46,<5",
  "peft>=0.15",
  "accelerate>=1.12",
  "huggingface-hub>=0.34",
  "datasets>=4.1",
  "PyYAML>=6",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
colab = [
  "ipywidgets>=8",
  "gradio>=6,<7",
]
cuda = ["bitsandbytes>=0.45"]
test = ["pytest>=8", "ipython>=8", "gradio>=6,<7"]
evaluation = ["math-verify[antlr4_13_2]>=0.8", "openai>=1.68"]

[project.urls]
Repository = "https://github.com/RuurdKuiper/BYOD"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diffusion_lm = ["generation_prompts.txt"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
